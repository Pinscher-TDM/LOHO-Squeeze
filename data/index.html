<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Studio LOHO Squeeze - lighting control interface">
 
    <title>SQUEEZE — Studio LOHO</title>
 
    <!-- Web App Manifest -->
    <link rel="manifest" href="./manifest.json">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" type="text/css" href="./style.css">

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Squeeze">
    <link rel="apple-touch-icon" href="./favicon.svg">

    <!-- Dynamic Glow Styles -->
    <style id="dynamic-glow">
        .brightness-icon.glow-active {
            box-shadow: 0 0 calc(10px + var(--glow-size, 0px)) calc(2px + var(--glow-spread, 0px)) rgba(255, 165, 0, 0.6);
            transition: box-shadow 0.15s ease-out;
        }
    </style>
</head>
 
<body>
 
<header class="site-header">
    <nav class="header-nav">
 
        <img
            src="./loho-logo.svg"
            alt="LOHO"
            class="logo"
        >
 
        <a href="/" class="nav-link active">
            CONTROL
        </a>
 
        <a href="/settings" class="nav-link">
            SETTINGS
        </a>
 
    </nav>
</header>
 
 
<main class="page">
    
      <section id="deviceSection">

        <div class="device-header">

            <div class="device-title">
                Devices
            </div>

            <button
                type="button"
                class="device-refresh"
                id="refreshDevicesBtn">
                Refresh
            </button>

        </div>

        <div id="deviceList"></div>

    </section>


    <!-- =====================================================
         CURRENT DEVICE INFO
         ===================================================== -->

    <div id="currentDeviceInfo"></div>
 
    <section class="control-section">
 
        <div class="control-card">

            <!-- =================================================
                 BRIGHTNESS ICON (Now works as a interactive slider)
                 ================================================= -->
 
            <div class="brightness-icon-wrapper">
 
                <div
                    class="brightness-icon"
                    id="brightnessIcon"
                    style="cursor: ns-resize; touch-action: none;"
                >
                <div class="brightness-icon-content">

                    <span id="brightnessValue">
                        0
                    </span>

                    <span class="brightness-unit">
                        %
                    </span>

                </div>
                
                    <div
                        class="brightness-fill"
                        id="brightnessFill"
                    ></div>
 
                </div>
 
            </div>
 
 
            <!-- =================================================
                 TOGGLE BUTTON
                 ================================================= -->
 
            <button
                class="btn toggle-btn inactive"
                id="toggleBtn"
                onclick="fetch('/api/control?toggle=1').then(() => syncState())"
            >
                <span class="btn-text">
                    Toggle light
                </span>
            </button>
 
        </div>
 
    </section>

</main>
 
 
<footer class="site-footer">
 
    <div class="footer-top">
 
        <div class="footer-brand">
 
            <img
                src="./loho-logo.svg"
                alt="LOHO"
                class="logo"
            >
 
        </div>
 
    </div>
 
      <button id="pwaInstallBtn" class="btn active" style="display: none; margin-top: 1rem;">
        <span class="btn-text">Install App</span>
    </button>

    <div id="iosInstallModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center;">
        <div style="background: #111; color: #fff; padding: 20px; border-radius: 12px; max-width: 300px; text-align: center; border: 1px solid #333;">
            <h3 style="margin-top: 0;">Install Squeeze</h3>
            <p style="font-size: 0.9rem; color: #ccc;">To install on iPhone:</p>
            <ol style="text-align: left; font-size: 0.85rem; line-height: 1.5; padding-left: 20px; color: #aaa;">
                <li>Tap the <strong>Share button</strong> in Safari menu.</li>
                <li>Scroll down and tap <strong>Add to Home Screen</strong>.</li>
            </ol>
            <button onclick="document.getElementById('iosInstallModal').style.display='none'" class="btn active" style="margin-top: 10px; width: 100%;">Got it</button>
        </div>
    </div>
    <div class="footer-bottom">
 
        <span>
            Studio LOHO
        </span>
 
        <span>
            © 2026
        </span>
        
    </div>

</footer>
 
 
<script>
 
let currentBrightness = 0;
let minB = 0;
let maxB = 254;
let isDragging = false;
let isLedOn = false;
 
 
/* =========================================================
   UPDATE BRIGHTNESS DISPLAY & GLOW EFFECT
   ========================================================= */
 
function updateBrightnessDisplay(value) {
 
    let percentage = 0;
 
    if (maxB > minB) {
 
        percentage = Math.round(
            ((Number(value) - minB) / (maxB - minB)) * 100
        );
 
    }
 
    percentage = Math.max(0, Math.min(100, percentage));
 
    document.getElementById('brightnessValue').innerText = percentage;
    document.getElementById('brightnessFill').style.height = percentage + '%';
 
    /*
     * Update Glow Effect based on percentage and ON state
     */
    const icon = document.getElementById('brightnessIcon');

    if (isLedOn) {
        icon.classList.add('glow-active');
        
        // Scale glow blur size (0px to 40px) and spread (0px to 15px) relative to brightness %
        const glowBlur = Math.round((percentage / 100) * 40);
        const glowSpread = Math.round((percentage / 100) * 15);

        icon.style.setProperty('--glow-size', glowBlur + 'px');
        icon.style.setProperty('--glow-spread', glowSpread + 'px');
    } else {
        icon.classList.remove('glow-active');
    }
}
 
 
/* =========================================================
   SYNCHRONIZE UI WITH ESP32
   ========================================================= */
 
function syncState() {
    if (isDragging) return; // Prevent overwriting while dragging
 
    fetch('/api/state')
 
        .then(response => {
 
            if (!response.ok) {
                throw new Error('Failed to get state');
            }
 
            return response.json();
 
        })
 
        .then(data => {
 
            const indicator = document.getElementById('powerIndicator');
            const toggleBtn = document.getElementById('toggleBtn');
 
            minB = Number(data.minB);
            maxB = Number(data.maxB);
            isLedOn = Boolean(data.ledOn);
 
            currentBrightness = Number(data.pwm);
            updateBrightnessDisplay(currentBrightness);
 
            if (isLedOn) {
 
                indicator.innerText = 'ON';
                indicator.classList.add('active');
 
                toggleBtn.classList.remove('inactive');
                toggleBtn.classList.add('active');
 
            } else {
 
                indicator.innerText = 'OFF';
                indicator.classList.remove('active');
 
                toggleBtn.classList.remove('active');
                toggleBtn.classList.add('inactive');
 
            }
 
        })
 
        .catch(error => {
 
            console.error('Failed to synchronize state:', error);
 
        });
 
}

 
/* =========================================================
   INTERACTIVE CIRCLE SLIDER
   ========================================================= */

const icon = document.getElementById('brightnessIcon');

function calculatePwmFromY(clientY) {
    const rect = icon.getBoundingClientRect();
    // 0 at top, 1 at bottom
    let ratio = (clientY - rect.top) / rect.height; 
    
    // Clamp ratio between 0 and 1
    ratio = Math.max(0, Math.min(1, ratio)); 
    
    // Invert so sliding UP increases brightness and sliding DOWN decreases
    const invertedRatio = 1 - ratio; 
    
    return Math.round(minB + invertedRatio * (maxB - minB));
}

function handlePointerMove(e) {
    if (!isDragging) return;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    currentBrightness = calculatePwmFromY(clientY);
    updateBrightnessDisplay(currentBrightness);
}

function handlePointerStart(e) {
    isDragging = true;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    currentBrightness = calculatePwmFromY(clientY);
    updateBrightnessDisplay(currentBrightness);
}

function handlePointerEnd() {
    if (!isDragging) return;
    isDragging = false;

    // Send final updated PWM to API
    fetch('/api/control?pwm=' + currentBrightness)
        .then(() => syncState())
        .catch(error => {
            console.error('Failed to update brightness:', error);
        });
}

// Mouse events
icon.addEventListener('mousedown', handlePointerStart);
window.addEventListener('mousemove', handlePointerMove);
window.addEventListener('mouseup', handlePointerEnd);

// Touch events for mobile
icon.addEventListener('touchstart', handlePointerStart);
window.addEventListener('touchmove', handlePointerMove);
window.addEventListener('touchend', handlePointerEnd);

 
/* =========================================================
   INITIAL SYNCHRONIZATION
   ========================================================= */
 
syncState();
 
 
/* =========================================================
   KEEP UI SYNCHRONIZED
   ========================================================= */
 
setInterval(syncState, 1000);


/* =========================================================
   PWA SERVICE WORKER REGISTRATION
   ========================================================= */

if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered:', reg.scope))
            .catch(err => console.error('Service Worker registration failed:', err));
    });
}
 /* =========================================================
   PWA INSTALL BUTTON LOGIC
   ========================================================= */

let deferredPrompt;
const installBtn = document.getElementById('pwaInstallBtn');
const iosModal = document.getElementById('iosInstallModal');

// Detect iOS device
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
// Detect if running already installed as a standalone PWA
const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

if (!isStandalone) {
    if (isIOS) {
        // Show install button for iOS users to open instruction modal
        installBtn.style.display = 'block';
        installBtn.addEventListener('click', () => {
            iosModal.style.display = 'flex';
        });
    } else {
        // Capture Android / Desktop browser install prompt
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', () => {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then((choiceResult) => {
                if (choiceResult.outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            });
        });
    }
}

// Hide button automatically if opened as installed PWA
window.addEventListener('appinstalled', () => {
    installBtn.style.display = 'none';
});
</script>
 
</body>
</html>

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Studio LOHO Squeeze - lighting control interface">

    <title>SQUEEZE — Studio LOHO</title>

    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" type="text/css" href="./style.css">
</head>

<body>

<header class="site-header">
    <nav class="header-nav">
        <img src="./loho-logo.svg" alt="LOHO" class="logo">

        <a href="/" class="nav-link active">CONTROL</a>
        <a href="/settings" class="nav-link">SETTINGS</a>
    </nav>
</header>


<main class="page">

    <section class="control-section">

        <div class="control-card">

            <div class="control-top">
                <div>
                    <div class="control-description">
                        Current State
                    </div>
                </div>

                <div class="power-indicator" id="powerIndicator">
                    OFF
                </div>
            </div>


            <div class="brightness-value">
                <span id="brightnessValue">0</span>
                <span class="brightness-unit">%</span>
            </div>


            <input
                type="range"
                id="dimmer"
                min="0"
                max="254"
                value="0"
                aria-label="Brightness"
            >


            <div class="range-labels">
                <span>MIN</span>
                <span>MAX</span>
            </div>


            <button
                class="btn toggle-btn inactive"
                id="toggleBtn"
                onclick="fetch('/api/control?toggle=1').then(() => syncState())"
            >
                <span class="btn text">Toggle light</span>
            </button>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="footer-top">
        <div class="footer-brand">
            <img src="./loho-logo.svg" alt="LOHO" class="logo">
        </div>
    </div>


    <div class="footer-bottom">
        <span>Studio LOHO</span>
        <span>© 2026</span>
    </div>

</footer>


<script>

let currentBrightness = 0;


/*
 * Update brightness percentage display
 */
function updateBrightnessDisplay(value) {

    const min = parseInt(
        document.getElementById('dimmer').min || 0
    );

    const max = parseInt(
        document.getElementById('dimmer').max || 254
    );

    let percentage = 0;

    if (max > min) {
        percentage = Math.round(
            ((value - min) / (max - min)) * 100
        );
    }

    document.getElementById('brightnessValue').innerText =
        percentage;
}


/*
 * Synchronize the UI with the ESP32 state
 */
function syncState() {

    fetch('/api/state')

        .then(response => {

            if (!response.ok) {
                throw new Error('Failed to get state');
            }

            return response.json();
        })

        .then(data => {

            const dimmer =
                document.getElementById('dimmer');

            const indicator =
                document.getElementById('powerIndicator');

            const toggleBtn =
                document.getElementById('toggleBtn');


            /*
             * Update dimmer limits and value
             */
            dimmer.min = data.minB;
            dimmer.max = data.maxB;
            dimmer.value = data.pwm;

            currentBrightness = data.pwm;

            updateBrightnessDisplay(data.pwm);

            /*
             * Update light state
             */
            if (data.ledOn) {

                /*
                 * Light is ON
                 */
                indicator.innerText = 'ON';

                indicator.classList.add('active');
                /*
                 * Button uses:
                 * .btn.toggle-btn.active
                 */
                toggleBtn.classList.remove('inactive');
                toggleBtn.classList.add('active');

            } else {

                /*
                 * Light is OFF
                 */
                indicator.innerText = 'OFF';

                indicator.classList.remove('active');
                /*
                 * Button uses:
                 * .btn.toggle-btn.inactive
                 */
                toggleBtn.classList.remove('active');
                toggleBtn.classList.add('inactive');

            }

        })

        .catch(error => {

            console.error(
                'Failed to synchronize state:',
                error
            );

        });
}


/*
 * Update brightness display while moving slider
 */
document
    .getElementById('dimmer')
    .addEventListener('input', function () {

        updateBrightnessDisplay(this.value);

    });


/*
 * Send brightness value when slider is released
 */
document
    .getElementById('dimmer')
    .addEventListener('change', function () {

        fetch('/api/control?pwm=' + this.value)
            .then(() => syncState())
            .catch(error => {

                console.error(
                    'Failed to update brightness:',
                    error
                );

            });

    });


/*
 * Initial synchronization
 */
syncState();


/*
 * Keep the UI synchronized with the ESP32
 */
setInterval(syncState, 1000);

</script>

</body>
</html>

[env:esp32c3]
; Matter support needs Arduino-ESP32 core 3.x+, which the official
; PlatformIO espressif32 platform does not ship yet. This uses the
; pioarduino community fork instead, which tracks the newer core.
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
board_build.filesystem = littlefs

; Matter + WiFi + BLE + LittleFS all compiled in needs more app partition
; space than the default scheme leaves. partitions.csv provides a custom layout
; that fits within the ESP32-C3's 4MB flash. If you hit "APP too big" at link time,
; this is the first thing to look at - adjust partition sizes as needed.
board_build.partitions = partitions.csv

; PlatformIO's size check defaults to board_upload.maximum_size, which for this
; board is the *entire* 4MB flash - not the app partition. That means an app
; that overflows its partition still builds and uploads "successfully", and you
; only discover it from the bootloader at boot:
;   esp_image: Image length <N> doesn't fit in partition length <M>
;   boot: No bootable app partition in the partition table
; Pinning this to the app partition size from partitions.csv (0x360000) makes
; the overflow a build error instead. Keep the two numbers in sync.
board_upload.maximum_size = 3538944

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
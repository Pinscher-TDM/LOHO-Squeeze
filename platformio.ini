[env:esp32c3]
; Matter support needs Arduino-ESP32 core 3.x+, which the official
; PlatformIO espressif32 platform does not ship yet. This uses the
; pioarduino community fork instead, which tracks the newer core.
; https://github.com/pioarduino/platform-espressif32
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = seeed_xiao_esp32c3
framework = arduino

monitor_speed = 115200
board_build.filesystem = littlefs

; Matter + WiFi + BLE + LittleFS all compiled in needs more app partition
; space than the default scheme leaves. min_spiffs.csv shrinks the
; filesystem partition (our data/ folder is only a few KB) in favor of a
; larger app partition. If you hit "APP too big" at link time, this is the
; first thing to look at - the XIAO ESP32-C3 has 4MB flash total.
board_build.partitions = min_spiffs.csv

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7
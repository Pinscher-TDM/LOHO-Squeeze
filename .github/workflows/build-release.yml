name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      create_release:
        description: 'Publish to GitHub Releases?'
        type: boolean
        default: true
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+' # Matches stable versions like v1.0.0 (excludes v1.0.0-alpha)

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build firmware
        run: pio run --environment esp32c3

      # The web UI lives in data/ and is served from LittleFS at runtime, so a
      # release without the filesystem image is only half a device.
      - name: Build filesystem image
        run: pio run --environment esp32c3 --target buildfs

      - name: Determine Version & Intent
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
            echo "should_release=${{ inputs.create_release }}" >> $GITHUB_OUTPUT
          else
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG_NAME}" >> $GITHUB_OUTPUT
            echo "should_release=true" >> $GITHUB_OUTPUT
          fi

      # ALWAYS saves the binary to the GitHub Actions run (great for testing/alpha builds)
      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32c3-firmware-${{ steps.vars.outputs.version }}
          path: |
            .pio/build/esp32c3/firmware.factory.bin
            .pio/build/esp32c3/firmware.bin
            .pio/build/esp32c3/littlefs.bin
            .pio/build/esp32c3/bootloader.bin
            .pio/build/esp32c3/partitions.bin

      # ONLY runs if publish flag is true or a production tag was pushed
      - name: Create Official GitHub Release
        if: steps.vars.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: Release ${{ steps.vars.outputs.version }}
          files: |
            .pio/build/esp32c3/firmware.factory.bin
            .pio/build/esp32c3/firmware.bin
            .pio/build/esp32c3/littlefs.bin
          generate_release_notes: true
          body: |
            ## Firmware Details
            - **Platform**: ESP32-C3
            - **Framework**: Arduino

            ## Flashing

            `firmware.factory.bin` is the complete image (bootloader +
            partition table + app) and is what you want for a blank board:

            ```
            esptool.py --chip esp32c3 write_flash 0x0 firmware.factory.bin
            esptool.py --chip esp32c3 write_flash 0x370000 littlefs.bin
            ```

            `firmware.bin` is the app alone, flashed at `0x10000`. It only
            boots on a device that already carries this project's partition
            table - writing it over a stock table gives you
            `No bootable app partition in the partition table`.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Start a new beta series? 'none' just increments the beta number on top of the last beta tag."
        required: true
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: "none"

      prerelease:
        description: "Mark as GitHub pre-release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-beta:
    name: Build Beta Release
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # Compute next beta version automatically
      # ------------------------------------------------------------
      - name: Compute beta version
        id: version
        shell: bash
        run: |
          set -e

          BUMP="${{ inputs.bump }}"

          git fetch --tags --force

          # Latest existing beta tag (any base version), e.g. v1.2.0-beta.3
          LATEST_BETA_TAG=$(git tag --list 'v*-beta.*' | sort -V | tail -n1 || true)

          # Latest stable (non-beta) tag, e.g. v1.2.0
          LATEST_STABLE_TAG=$(git tag --list 'v*' | grep -vE -- '-beta\.' | sort -V | tail -n1 || true)

          echo "Latest beta tag:   ${LATEST_BETA_TAG:-none}"
          echo "Latest stable tag: ${LATEST_STABLE_TAG:-none}"

          bump_version() {
            local ver="${1#v}" part="$2" major minor patch
            IFS='.' read -r major minor patch <<< "$ver"
            case "$part" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              patch) patch=$((patch+1)) ;;
            esac
            echo "v${major}.${minor}.${patch}"
          }

          if [[ "$BUMP" != "none" ]]; then
            # Explicitly starting a new beta series off the latest stable
            # release (or off the latest beta's base version if there's no
            # stable release yet).
            if [[ -n "$LATEST_STABLE_TAG" ]]; then
              BASE=$(bump_version "$LATEST_STABLE_TAG" "$BUMP")
            elif [[ -n "$LATEST_BETA_TAG" ]]; then
              STRIPPED_BASE="${LATEST_BETA_TAG%-beta.*}"
              BASE=$(bump_version "$STRIPPED_BASE" "$BUMP")
            else
              BASE="v0.1.0"
            fi
            BETA_NUM=1
          else
            # Just continue the current beta series.
            if [[ -n "$LATEST_BETA_TAG" ]]; then
              BASE="${LATEST_BETA_TAG%-beta.*}"
              CURRENT_NUM="${LATEST_BETA_TAG##*-beta.}"
              BETA_NUM=$((CURRENT_NUM + 1))
            elif [[ -n "$LATEST_STABLE_TAG" ]]; then
              BASE=$(bump_version "$LATEST_STABLE_TAG" "patch")
              BETA_NUM=1
            else
              BASE="v0.1.0"
              BETA_NUM=1
            fi
          fi

          VERSION="${BASE}-beta.${BETA_NUM}"

          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "ERROR: computed tag $VERSION already exists. Re-run with a 'bump' value to start a new series."
            exit 1
          fi

          echo "Computed version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------------------
      # PlatformIO
      # ------------------------------------------------------------
      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      # ------------------------------------------------------------
      # Build firmware
      # ------------------------------------------------------------
      - name: Build firmware
        run: |
          pio run --environment esp32c3

      # ------------------------------------------------------------
      # Build LittleFS
      #
      # This packages the current /data directory.
      # ------------------------------------------------------------
      - name: Build LittleFS filesystem
        run: |
          pio run \
            --environment esp32c3 \
            --target buildfs

      # ------------------------------------------------------------
      # Verify build
      # ------------------------------------------------------------
      - name: Verify build files
        shell: bash
        run: |
          set -e

          BUILD_DIR=".pio/build/esp32c3"

          REQUIRED_FILES=(
            "firmware.bin"
            "firmware.factory.bin"
            "littlefs.bin"
            "bootloader.bin"
            "partitions.bin"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$BUILD_DIR/$FILE" ]; then
              echo "ERROR: Missing $FILE"
              exit 1
            fi

            echo "Found $FILE ($(stat -c%s "$BUILD_DIR/$FILE") bytes)"
          done

      # ------------------------------------------------------------
      # Prepare release files
      # ------------------------------------------------------------
      - name: Prepare beta release
        shell: bash
        run: |
          set -e

          VERSION="${{ steps.version.outputs.version }}"
          BUILD_DIR=".pio/build/esp32c3"
          RELEASE_DIR="release"

          mkdir -p "$RELEASE_DIR"

          cp "$BUILD_DIR/firmware.bin" \
            "$RELEASE_DIR/loho-squeeze-${VERSION}-firmware.bin"

          cp "$BUILD_DIR/firmware.factory.bin" \
            "$RELEASE_DIR/loho-squeeze-${VERSION}-factory.bin"

          cp "$BUILD_DIR/littlefs.bin" \
            "$RELEASE_DIR/loho-squeeze-${VERSION}-littlefs.bin"

          cp "$BUILD_DIR/bootloader.bin" \
            "$RELEASE_DIR/loho-squeeze-${VERSION}-bootloader.bin"

          cp "$BUILD_DIR/partitions.bin" \
            "$RELEASE_DIR/loho-squeeze-${VERSION}-partitions.bin"

          # --------------------------------------------------------
          # Windows flashing script
          # --------------------------------------------------------
          cat > "$RELEASE_DIR/flash-all.bat" <<EOF
          @echo off

          echo.
          echo LOHO Squeeze ${VERSION} - BETA
          echo =================================
          echo.
          echo WARNING: This is a BETA release.
          echo.
          echo This will erase the ESP32-C3.
          echo.
          pause

          esptool.py --chip esp32c3 erase_flash

          esptool.py --chip esp32c3 write_flash 0x0 loho-squeeze-${VERSION}-factory.bin

          esptool.py --chip esp32c3 write_flash 0x290000 loho-squeeze-${VERSION}-littlefs.bin

          echo.
          echo Beta firmware installed.
          pause
          EOF

          # --------------------------------------------------------
          # Linux/macOS flashing script
          # --------------------------------------------------------
          cat > "$RELEASE_DIR/flash-all.sh" <<EOF
          #!/bin/bash

          set -e

          echo
          echo "LOHO Squeeze ${VERSION} - BETA"
          echo "================================="
          echo
          echo "WARNING: This is a BETA release."
          echo
          echo "This will erase the ESP32-C3."
          echo

          read -p "Continue? [y/N] " ANSWER

          if [[ "\$ANSWER" != "y" && "\$ANSWER" != "Y" ]]; then
              exit 0
          fi

          esptool.py --chip esp32c3 erase_flash

          esptool.py --chip esp32c3 write_flash \
            0x0 loho-squeeze-${VERSION}-factory.bin

          esptool.py --chip esp32c3 write_flash \
            0x290000 loho-squeeze-${VERSION}-littlefs.bin

          echo
          echo "Beta firmware installed."
          EOF

          chmod +x "$RELEASE_DIR/flash-all.sh"

          # --------------------------------------------------------
          # Release README
          # --------------------------------------------------------
          cat > "$RELEASE_DIR/README.txt" <<EOF
          LOHO Squeeze ${VERSION} - BETA
          ===============================

          THIS IS A BETA RELEASE.

          Firmware:
              loho-squeeze-${VERSION}-firmware.bin

          Factory image:
              loho-squeeze-${VERSION}-factory.bin

          Web UI / LittleFS:
              loho-squeeze-${VERSION}-littlefs.bin

          The LittleFS image contains the current contents
          of the project's /data directory.

          LittleFS flash address:

              0x290000

          Firmware OTA updates the application firmware only.

          To install the complete release manually:

              esptool.py --chip esp32c3 erase_flash

              esptool.py --chip esp32c3 write_flash \
                0x0 loho-squeeze-${VERSION}-factory.bin

              esptool.py --chip esp32c3 write_flash \
                0x290000 loho-squeeze-${VERSION}-littlefs.bin
          EOF

          # --------------------------------------------------------
          # ZIP
          # --------------------------------------------------------
          cd "$RELEASE_DIR"
          zip -r "../loho-squeeze-${VERSION}.zip" .
          cd ..

      # ------------------------------------------------------------
      # Upload workflow artifact
      # ------------------------------------------------------------
      - name: Upload beta artifact
        uses: actions/upload-artifact@v4
        with:
          name: loho-squeeze-${{ steps.version.outputs.version }}
          path: |
            release/*
            loho-squeeze-${{ steps.version.outputs.version }}.zip

      # ------------------------------------------------------------
      # Create GitHub Beta Release
      # ------------------------------------------------------------
      - name: Create GitHub Beta Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "LOHO Squeeze ${{ steps.version.outputs.version }} — BETA"

          prerelease: ${{ inputs.prerelease }}

          generate_release_notes: true

          files: |
            release/loho-squeeze-${{ steps.version.outputs.version }}-firmware.bin
            release/loho-squeeze-${{ steps.version.outputs.version }}-factory.bin
            release/loho-squeeze-${{ steps.version.outputs.version }}-littlefs.bin
            release/loho-squeeze-${{ steps.version.outputs.version }}-bootloader.bin
            release/loho-squeeze-${{ steps.version.outputs.version }}-partitions.bin
            release/flash-all.sh
            release/flash-all.bat
            release/README.txt
            loho-squeeze-${{ steps.version.outputs.version }}.zip

          body: |
            ## ⚠️ LOHO Squeeze ${{ steps.version.outputs.version }} — BETA

            **This is a beta release and is intended for testing.**

            ### Included

            | File | Description |
            |---|---|
            | `*-firmware.bin` | Application firmware |
            | `*-factory.bin` | Complete ESP32-C3 factory image |
            | `*-littlefs.bin` | Current `/data` web UI |
            | `*-bootloader.bin` | Bootloader |
            | `*-partitions.bin` | Partition table |
            | `flash-all.bat` | Windows complete flash |
            | `flash-all.sh` | Linux/macOS complete flash |
            | `.zip` | Complete package |

            ### Web UI

            `*-littlefs.bin` was generated from the current repository
            `data/` directory.

            Therefore all current changes to:

            - `data/index.html`
            - `data/settings.html`
            - `data/update.html`
            - `data/style.css`

            are included.

            ### ⚠️ Important

            The current OTA updater updates the firmware application
            only. It does not automatically update LittleFS.

            For a complete manual installation, flash both:

            ```text
            factory.bin  →  0x000000
            littlefs.bin  → 0x290000
            ```
